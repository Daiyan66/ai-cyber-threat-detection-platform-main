services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soc_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./threats.db:/app/threats.db
      - ./data:/app/data
      - ./ml:/app/ml
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: soc_ai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
